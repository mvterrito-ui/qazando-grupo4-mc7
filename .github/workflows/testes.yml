# Pipeline de testes — entregável 3 da atividade ("automação web: stack,
# arquitetura, pipeline") e fonte da métrica 6 ("execuções verdes vs. vermelhas").
#
# Roda a cada push e a cada pull request. Como nada entra no repositório sem
# revisão, o resultado da pipeline aparece na própria PR: quem revisa vê se os
# testes passaram antes de aprovar.

name: Testes automatizados

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:        # permite rodar na mão pelo botão do GitHub

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    # A IA da plataforma é lenta; a suíte inteira não deve passar disso.
    timeout-minutes: 60

    defaults:
      run:
        working-directory: automacao

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: automacao/package.json

      - name: Instalar dependências
        run: npm install

      - name: Instalar o navegador
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes
        # As credenciais vêm dos Secrets do repositório, nunca do código.
        # Configure em: Settings > Secrets and variables > Actions
        #   QA_EMAIL, QA_PASSWORD
        # O código premium não é segredo — a /docs publica ele.
        env:
          BASE_URL: https://english.qazando.com.br
          QA_EMAIL: ${{ secrets.QA_EMAIL }}
          QA_PASSWORD: ${{ secrets.QA_PASSWORD }}
          PREMIUM_CODE: QAZANDOENGLISH2025
        run: npm test

      - name: Guardar o relatório
        # if: always() — o relatório interessa MAIS quando o teste falha.
        # Sem isso, o passo é pulado justamente na hora em que ele importa.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: automacao/playwright-report/
          retention-days: 14

      - name: Guardar as evidências das falhas
        # Trace, screenshot e vídeo — a evidência que vai anexada no bug do Jira.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias
          path: automacao/test-results/
          retention-days: 14
